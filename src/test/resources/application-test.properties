# Integration tests run against a dedicated database so they never touch dev data.
# Flyway builds the schema on first run (clinstra_test is created by hand, see API-PLAN.md section 2).
spring.datasource.url=jdbc:postgresql://localhost:5432/clinstra_test
spring.datasource.username=clinstra
spring.datasource.password=clinstra
clinstra.dev-seed.enabled=false
clinstra.jwt.secret=test-only-secret-0123456789abcdef0123456789
