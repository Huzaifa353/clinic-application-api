# Production profile (SPRING_PROFILES_ACTIVE=prod). Everything secret comes from the environment and has
# NO default here: the application refuses to start if one is missing (and ProductionSafetyCheck refuses
# the development defaults).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

clinstra.jwt.secret=${JWT_SECRET}
clinstra.secrets.key=${SECRETS_KEY}
clinstra.cors.allowed-origins=${CORS_ORIGINS}
clinstra.timezone=${CLINIC_TIMEZONE:Asia/Karachi}

# Demo users and demo medicines must never be created in production.
clinstra.dev-seed.enabled=false

# Do not leak internals in error responses or the health probe.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.org.springframework.security=WARN

# Do not publish the API description in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
