# Desktop (installed, single-PC) profile. The launcher starts PostgreSQL and this backend on the same
# computer and supplies every secret and path through environment variables it generated at first run.
server.address=127.0.0.1
server.port=${CLINSTRA_PORT:18080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

clinstra.jwt.secret=${JWT_SECRET}
clinstra.secrets.key=${SECRETS_KEY}
clinstra.timezone=${CLINIC_TIMEZONE:Asia/Karachi}
# The Angular app is served by this backend from the same origin, so the browser needs no CORS.
clinstra.cors.allowed-origins=http://127.0.0.1:${CLINSTRA_PORT:18080},http://localhost:${CLINSTRA_PORT:18080}
clinstra.web.dir=${CLINSTRA_WEB_DIR}

# No demo accounts. The first accounts come from the setup window (see FirstRunSeeder).
clinstra.dev-seed.enabled=false
clinstra.seed-medicines=true
clinstra.first-run.file=${CLINSTRA_FIRST_RUN_FILE:}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.devtools.restart.enabled=false

logging.level.root=INFO
logging.level.org.springframework.security=WARN

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
