spring.application.name=backend
server.port=8080

# PostgreSQL (local dev defaults; override with env vars in other environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinstra}
spring.datasource.username=${DB_USERNAME:clinstra}
spring.datasource.password=${DB_PASSWORD:clinstra}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
