spring.application.name=backend
server.port=${PORT:8080}

# PostgreSQL (local dev defaults; override with env vars in other environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinstra}
spring.datasource.username=${DB_USERNAME:clinstra}
spring.datasource.password=${DB_PASSWORD:clinstra}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Clinstra ---
# Clinic-local "today" (queue day, tokens, follow-ups) is computed in this zone.
clinstra.timezone=Asia/Karachi
# Origins allowed to call the API from a browser (comma separated).
clinstra.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
# JWT signing key: at least 32 characters. The default is for local development ONLY.
clinstra.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
clinstra.jwt.ttl-hours=12
# Creates the demo doctor + assistant on startup when no users exist (dev only).
clinstra.dev-seed.enabled=${DEV_SEED:true}
clinstra.dev-seed.password=${DEV_SEED_PASSWORD:123456}

# Uploads (logo, signature, patient documents). Per-type limits are enforced in code.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
# Encrypts integration secrets (WhatsApp / JazzCash / EasyPaisa) at rest. Local development default ONLY.
clinstra.secrets.key=${SECRETS_KEY:dev-only-secrets-key-change-me-in-production}

# API documentation (Swagger UI at /swagger-ui.html, JSON at /v3/api-docs). Turned off in production.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
